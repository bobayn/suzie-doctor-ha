configuration:
  trust_mode:
    name: Trust mode
    description: Controls whether treatment is disabled (manual) or available to Suzie Doctor after its autonomous risk assessment. No mode bypasses hard safety invariants.
  daily_audit_time:
    name: Daily audit time
    description: Local Home Assistant time for the deep daily audit.
  retention_days:
    name: History retention days
    description: Minimum 30 days.
  language:
    name: Interface language
  developer_mode:
    name: Developer mode
    description: Enables developer-only diagnostic controls.
  auto_install_bridge:
    name: Install Home Assistant bridge automatically
  auto_restart_core_once:
    name: Legacy Core restart option — ignored
  doctor_server_enabled:
    name: Use Suzie Doctor Server
    description: Receive diagnoses and signed protocol packages from the Doctor server.
  doctor_server_url:
    name: Suzie Doctor Server URL
    description: HTTPS address of the protected knowledge server.
  doctor_server_timeout_seconds:
    name: Doctor Server timeout, seconds
    description: Maximum time for one server request.
