configuration:
  trust_mode:
    name: Режим доверия
    description: Определяет, отключено ли лечение (manual) или доступно Сьюзи Доктор после её автономной оценки риска. Ни один режим не обходит жёсткие предохранители.
  daily_audit_time:
    name: Время суточного аудита
    description: Локальное время Home Assistant для глубокого аудита.
  retention_days:
    name: Срок хранения истории, дней
    description: Минимум 30 дней.
  language:
    name: Язык интерфейса
  developer_mode:
    name: Режим разработчика
    description: Включает служебные диагностические функции.
  auto_install_bridge:
    name: Автоматически установить bridge в Home Assistant
  auto_restart_core_once:
    name: Устаревшая опция restart Core — игнорируется
  doctor_server_enabled:
    name: Использовать Suzie Doctor Server
    description: Получать диагнозы и подписанные протоколы с серверной части Doctor.
  doctor_server_url:
    name: Адрес Suzie Doctor Server
    description: HTTPS-адрес защищённого сервера знаний.
  doctor_server_timeout_seconds:
    name: Таймаут Doctor Server, секунд
    description: Максимальное ожидание одного запроса к серверу.
